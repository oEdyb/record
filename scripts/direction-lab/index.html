<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>screenrec Direction Lab</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
				background: #09090b;
				color: #f4f4f5;
			}
			* { box-sizing: border-box; }
			body { margin: 0; min-width: 980px; background: #09090b; }
			button, select, input { font: inherit; }
			button, select {
				border: 1px solid #303036;
				background: #18181b;
				color: #f4f4f5;
				border-radius: 9px;
				height: 34px;
				padding: 0 12px;
			}
			button:hover, select:hover { border-color: #52525b; }
			button:disabled { cursor: default; opacity: .45; }
			.app { max-width: 1660px; margin: 0 auto; padding: 28px 32px 40px; }
			.header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
			.eyebrow { color: #71717a; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
			h1 { font-size: 25px; line-height: 1.2; margin: 5px 0 4px; letter-spacing: -.025em; }
			.subtitle { margin: 0; color: #a1a1aa; font-size: 13px; }
			.lab-note { margin: -10px 0 18px; color: #71717a; font-size: 11px; }
			.transport { display: flex; align-items: center; gap: 9px; }
			#play { min-width: 78px; background: #f4f4f5; color: #09090b; border-color: #f4f4f5; font-weight: 650; }
			.time { width: 108px; color: #d4d4d8; font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
			.workspace { border-top: 1px solid #27272a; padding-top: 18px; }
			.timeline-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
			.timeline-row label { color: #a1a1aa; font-size: 12px; }
			#scrubber { width: 100%; accent-color: #f4f4f5; }
			.click-track { position: relative; height: 24px; margin: 1px 76px 18px 103px; }
			.click-dot { position: absolute; top: 7px; width: 8px; height: 8px; margin-left: -4px; border: 0; padding: 0; border-radius: 50%; background: #a78bfa; box-shadow: 0 0 0 4px rgba(167,139,250,.1); cursor: pointer; }
			.controls { display: grid; grid-template-columns: 1.2fr repeat(5, 1fr); gap: 22px; padding: 15px 0 21px; border-top: 1px solid #18181b; }
			.control { min-width: 0; }
			.control-header { display: flex; justify-content: space-between; gap: 8px; color: #a1a1aa; font-size: 11px; margin-bottom: 8px; }
			.control output { color: #f4f4f5; font-variant-numeric: tabular-nums; }
			.control input[type="range"] { width: 100%; accent-color: #a78bfa; }
			.control select { width: 100%; }
			.comparison { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
			.variant { min-width: 0; }
			.variant-heading { min-height: 82px; padding: 2px 2px 12px; }
			.variant-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
			.variant h2 { font-size: 14px; margin: 0; letter-spacing: -.01em; }
			.variant p { color: #8b8b94; font-size: 11px; line-height: 1.45; margin: 7px 0 0; }
			.status { flex: none; font-size: 10px; font-weight: 650; color: #86efac; }
			.status.warn { color: #fca5a5; }
			.canvas-wrap { position: relative; overflow: hidden; border-radius: 13px; background: #111113; border: 1px solid #2b2b30; box-shadow: 0 16px 40px rgba(0,0,0,.22); }
			canvas { display: block; width: 100%; height: auto; }
			.metrics { display: flex; gap: 15px; padding: 11px 2px 0; color: #71717a; font-size: 10px; font-variant-numeric: tabular-nums; }
			.metrics strong { color: #d4d4d8; font-weight: 600; }
			.legend { display: flex; gap: 20px; margin-top: 22px; color: #71717a; font-size: 11px; }
			.legend span::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; vertical-align: 1px; }
			.legend .cursor::before { background: #67e8f9; }
			.legend .click::before { background: #a78bfa; }
			.legend .safe::before { border: 1px dashed rgba(255,255,255,.45); border-radius: 1px; background: transparent; }
			#source { position: fixed; left: -4px; bottom: -4px; width: 1px; height: 1px; opacity: .01; pointer-events: none; }
		</style>
	</head>
	<body>
		<div class="app">
			<header class="header">
				<div>
					<div class="eyebrow">screenrec experimental direction lab</div>
					<h1>Compare motion sketches</h1>
					<p class="subtitle" id="source-label">Loading real recording…</p>
				</div>
				<div class="transport">
					<button id="play" type="button" disabled>Play</button>
					<label><input id="loop" type="checkbox" checked /> Loop</label>
					<div class="time" id="time">00:00.000</div>
				</div>
			</header>
			<p class="lab-note">This lab uses separate preview math. It does not prove editor or export parity.</p>

			<main class="workspace">
				<div class="timeline-row">
					<label for="scrubber">Click sequence</label>
					<input id="scrubber" type="range" step="0.001" />
					<select id="chain" aria-label="Click chain"></select>
				</div>
				<div class="click-track" id="click-track"></div>

				<section class="controls" aria-label="Connected-pan policy">
					<div class="control">
						<div class="control-header"><label for="sequence-mode">Sequence</label><output id="click-count"></output></div>
						<select id="sequence-mode">
							<option value="review">Compare all three</option>
						</select>
					</div>
					<div class="control">
						<div class="control-header"><label for="scale">Requested zoom</label><output id="scale-output"></output></div>
						<input id="scale" type="range" min="1.2" max="1.8" step="0.05" value="1.65" />
					</div>
					<div class="control">
						<div class="control-header"><label for="safe">Safe inset</label><output id="safe-output"></output></div>
						<input id="safe" type="range" min="0.05" max="0.3" step="0.01" value="0.18" />
					</div>
					<div class="control">
						<div class="control-header"><label for="anticipation">Anticipation</label><output id="anticipation-output"></output></div>
						<input id="anticipation" type="range" min="0" max="300" step="25" value="100" />
					</div>
					<div class="control">
						<div class="control-header"><label for="pan-min">Nearest pan</label><output id="pan-min-output"></output></div>
						<input id="pan-min" type="range" min="200" max="700" step="25" value="400" />
					</div>
					<div class="control">
						<div class="control-header"><label for="pan-max">Farthest pan</label><output id="pan-max-output"></output></div>
						<input id="pan-max" type="range" min="400" max="1200" step="25" value="700" />
					</div>
				</section>

				<div class="comparison" id="comparison"></div>
				<div class="legend">
					<span class="cursor">Recorded cursor</span>
					<span class="click">Click</span>
					<span class="safe">Padded safe area</span>
				</div>
			</main>
		</div>
		<video id="source" preload="auto" playsinline></video>
		<script type="module" src="./client.mjs"></script>
	</body>
</html>

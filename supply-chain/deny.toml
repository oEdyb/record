# One policy covers every Rust graph shipped by Klippt. CI passes the exact
# Cargo.toml for each graph, so a nested lockfile cannot escape the checks.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "simplest-path"
skip = [
    # These entries describe the duplicate versions already present in the three
    # locked Rust graphs. A new package name or version still fails this check.
    { crate = "bitflags@1.3.2", reason = "png, ebur128, and the current Metal bindings still require the 1.x API while newer dependencies use 2.x" },
    { crate = "font-types@0.11.3", reason = "the current cosmic-text stack spans two compatible fontations generations" },
    { crate = "getrandom@0.2.17", reason = "older rand and tract dependencies use 0.2 while tempfile uses the current 0.4 API" },
    { crate = "hashbrown@0.11.2", reason = "the pinned tract graph uses an older string-interner stack" },
    { crate = "hashbrown@0.13.2", reason = "the pinned DeepFilterNet graph uses rust-ini through ordered-multimap" },
    { crate = "hashbrown@0.15.5", reason = "the current wgpu graph has not converged on hashbrown 0.17" },
    { crate = "itertools@0.10.5", reason = "the pinned DeepFilterNet and tract graph uses 0.10 while its build tooling uses 0.14" },
    { crate = "jni-sys@0.3.1", reason = "Android-only transitive branches in the cross-platform compositor graph use two JNI generations" },
    { crate = "metal@0.29.0", reason = "the compositor's direct macOS backend uses 0.29 while wgpu's backend uses 0.31" },
    { crate = "read-fonts@0.37.0", reason = "the current cosmic-text stack spans two compatible fontations generations" },
    { crate = "rustc-hash@1.1.0", reason = "the current text and graphics stacks use two rustc-hash API generations" },
    { crate = "shlex@1.3.0", reason = "bindgen uses shlex 1 while the cc build dependency uses shlex 2" },
    { crate = "skrifa@0.40.0", reason = "the current cosmic-text stack spans two compatible fontations generations" },
    { crate = "syn@1.0.109", reason = "the pinned tract graph still contains proc macros built on syn 1" },
    { crate = "syn@2.0.119", reason = "current proc-macro dependencies have not all converged on syn 3" },
    { crate = "thiserror@1.0.69", reason = "the pinned DeepFilterNet graph uses thiserror 1 while current graphics dependencies use 2" },
    { crate = "thiserror-impl@1.0.69", reason = "paired implementation crate for the reviewed thiserror 1 duplicate" },
    { crate = "windows-sys@0.52.0", reason = "cross-platform dependencies intentionally support several Windows API crate generations" },
    { crate = "windows-sys@0.59.0", reason = "cross-platform dependencies intentionally support several Windows API crate generations" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/oEdyb/DeepFilterNet.git"]

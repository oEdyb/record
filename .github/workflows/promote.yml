name: Prepare RC promotion to stable

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "RC tag to promote (e.g. v1.5.0-rc.2)"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: Prepare stable release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: ./.github/actions/setup

      - name: Validate RC tag and compute stable version
        id: version
        env:
          RC_TAG: ${{ inputs.rc_tag }}
        run: |
          set -euo pipefail
          TAG="${RC_TAG}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(rc|beta|alpha)\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.5.0-rc.1; got '${TAG}'"
            exit 1
          fi
          STABLE_VERSION="${BASH_REMATCH[1]}"
          STABLE_TAG="v${STABLE_VERSION}"
          {
            echo "rc_tag=$TAG"
            echo "stable_version=$STABLE_VERSION"
            echo "stable_tag=$STABLE_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Promoting ${TAG} -> ${STABLE_TAG}"

      - name: Verify the signed RC source
        id: rc_source
        env:
          RC_TAG: ${{ steps.version.outputs.rc_tag }}
          KLIPPT_RELEASE_PUBLIC_KEY: ${{ vars.KLIPPT_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RC_TAG}:refs/tags/${RC_TAG}"
          RC_SHA=$(git rev-parse "${RC_TAG}^{commit}")
          GITHUB_EVENT_NAME=push \
          GITHUB_SHA="$RC_SHA" \
          GITHUB_REF_TYPE=tag \
          GITHUB_REF_NAME="$RC_TAG" \
            node scripts/resolve-release-source.mjs
          echo "source_sha=${RC_SHA}" >> "$GITHUB_OUTPUT"

      - name: Bump the version to stable on the release branch
        id: prepare
        env:
          STABLE_VERSION: ${{ steps.version.outputs.stable_version }}
          STABLE_TAG: ${{ steps.version.outputs.stable_tag }}
          RC_SHA: ${{ steps.rc_source.outputs.source_sha }}
        run: |
          set -euo pipefail
          # Promote checks out the FROZEN release branch (created by prerelease.yml) and
          # rewrites the version there. This guarantees the stable tag points at the
          # same code that was tested as the RC plus any cherry-picked bugfixes.
          BRANCH="release/v${STABLE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${STABLE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag ${STABLE_TAG} already exists and must never be replaced."
            exit 1
          fi
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/${BRANCH}"
          BRANCH_SHA=$(git rev-parse HEAD)
          if [[ "$BRANCH_SHA" != "$RC_SHA" ]]; then
            echo "::error::${BRANCH} moved after the tested RC (${RC_SHA} -> ${BRANCH_SHA}). Cut and test a new RC before promotion."
            exit 1
          fi
          # Writes package-lock.json too. A sed over package.json alone left the
          # lockfile behind on every release up to 1.9.0; see the script header.
          node .github/scripts/set-release-version.mjs "${STABLE_VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump to ${STABLE_VERSION} [skip ci]"
          fi
          git push origin "$BRANCH"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # No announcement step: Klippt releases are not announced from CI.
      #
      # Bookkeeping only. The stable tag is still created locally after this job, so a
      # sync failure cannot publish an unreviewed or unsigned release.
      - name: Merge release branch into main
        id: sync_main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_VERSION: ${{ steps.version.outputs.stable_version }}
        run: |
          set -euo pipefail
          # Sync main with the prepared stable snapshot through a normal rebase PR.
          # The repository permits this workflow's explicitly write-scoped token
          # to create PRs; it receives no branch-protection bypass.
          BRANCH="release/v${STABLE_VERSION}"
          # If main already contains the release branch (clean fast-forward), there's
          # nothing to merge — just make sure the branch is tracked locally.
          git fetch origin main "$BRANCH"
          if git merge-base --is-ancestor "origin/${BRANCH}" origin/main; then
            echo "origin/${BRANCH} is already an ancestor of origin/main — nothing to merge."
            exit 0
          fi
          # Push the release branch's commits onto main as a fresh branch and PR it.
          git checkout -b "${BRANCH}-sync" "origin/${BRANCH}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${BRANCH}-sync"
          gh pr create \
            --base main \
            --head "${BRANCH}-sync" \
            --title "chore(release): release v${STABLE_VERSION} into main" \
            --body "Sync main with the released snapshot (RC + cherry-picked bugfixes + version bump)." \
            --repo "$GITHUB_REPOSITORY" || echo "(PR already exists — skipping)"
          PR_NUMBER=$(gh pr list --head "${BRANCH}-sync" --state open --json number -q '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [[ -z "$PR_NUMBER" ]]; then
            # L'échec de `gh pr create` ci-dessus est converti en echo, donc on
            # arrive ici aussi bien quand la PR existait déjà que quand sa création
            # a échoué pour une autre raison. Sortir en 0 dans le second cas
            # reportait sync_main en succès alors que le test d'ascendance du haut
            # avait justement établi que main ne contient pas la branche, et
            # l'avertissement de fin sautait. On re-teste plutôt que de supposer :
            # quelqu'un a pu merger la synchro à la main entre-temps.
            git fetch origin main "$BRANCH"
            if git merge-base --is-ancestor "origin/${BRANCH}" origin/main; then
              echo "origin/${BRANCH} is already an ancestor of origin/main — nothing to merge."
              exit 0
            fi
            echo "::error::No open sync PR exists and main does not contain ${BRANCH}."
            exit 1
          fi
          # GitHub computes mergeability asynchronously. Merging ~3s after creating the
          # PR raced that computation every time: v1.9.0 got "This branch can't be
          # rebased" 2.9s after create, v1.8.0 "has merge conflicts" after 1.7s — and
          # both merged by hand, unchanged, minutes later. Wait for a real verdict.
          for _ in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus -q .mergeStateStatus \
              --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo UNKNOWN)
            echo "mergeStateStatus=${STATE}"
            if [[ "$STATE" != "UNKNOWN" ]]; then break; fi
            sleep 5
          done
          # Retry anyway: leaving UNKNOWN is necessary, not sufficient. MERGED must be
          # set by a successful merge — a bare `&& break` loop exits 0 after five
          # failures and reports a merge that never happened.
          MERGED=0
          for _ in $(seq 1 5); do
            if gh pr merge "$PR_NUMBER" --rebase --delete-branch \
              --repo "$GITHUB_REPOSITORY"; then
              MERGED=1
              break
            fi
            sleep 15
          done
          if [[ "$MERGED" -ne 1 ]]; then
            echo "::error::Could not rebase-merge sync PR #${PR_NUMBER} into main after 5 attempts. No stable tag was created; merge it by hand before signing."
            exit 1
          fi
          # The release branch contains the prepared frozen history. Leave it in place
          # for forensics. A v1.6.0 branch should never be deleted until a future major
          # supersedes that release line.

      - name: Workflow summary
        run: |
          {
            echo "## Stable release prepared"
            echo ""
            echo "- Stable tag: \`${{ steps.version.outputs.stable_tag }}\`"
            echo "- Promoted from: \`${{ steps.version.outputs.rc_tag }}\`"
            echo "- Exact source: \`${{ steps.prepare.outputs.source_sha }}\`"
            echo ""
            echo "The stable release is not published yet. Sign the exact source on your Mac:"
            echo ""
            echo '~~~bash'
            echo "git fetch origin ${{ steps.prepare.outputs.branch }}"
            echo "git -c user.name='Olle Dyberg' -c user.email='131144165+oEdyb@users.noreply.github.com' -c gpg.format=ssh -c user.signingkey=\"\$HOME/.ssh/klippt_dependency_approval\" tag -s -m 'Klippt ${{ steps.version.outputs.stable_tag }}' '${{ steps.version.outputs.stable_tag }}' '${{ steps.prepare.outputs.source_sha }}'"
            echo "git push origin 'refs/tags/${{ steps.version.outputs.stable_tag }}'"
            echo '~~~'
            echo ""
            echo "The signed tag push starts the verified build. Tier 3 starts only after the GitHub release exists."
            if [[ "${{ steps.sync_main.outcome }}" != "success" ]]; then
              echo ""
              echo "> [!WARNING]"
              echo "> **main was not synced.** Do not sign the stable tag yet. Merge the"
              echo "> \`release/v${{ steps.version.outputs.stable_version }}-sync\` → main PR first."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

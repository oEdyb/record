name: Setup Node.js
description: Install locked Node and npm dependencies, with an optional Electron runtime
inputs:
  electron:
    description: Install the Electron runtime for app execution or package-asset checks
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Verify the locked Node and npm baseline
      run: |
        test "$(node --version)" = "v22.22.1"
        test "$(npm --version)" = "10.9.4"
      shell: bash
    - run: npm ci
      shell: bash
    - name: Install the pinned Electron binary
      if: inputs.electron == 'true'
      run: npx install-electron --no
      shell: bash
